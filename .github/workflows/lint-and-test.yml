# Lint, EUnit and Dialyzer, in the CI image that pins the toolchain.
#
# The suite includes record_victron_reading_tests, which runs the command path
# against a real reckon-db store.

name: lint-and-test

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'scripts/**', 'LICENSE']
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      # ⚠ MUST MATCH THE `Containerfile' beside it: OTP 28.4.3. The dated
      # macula-ci-otp tag is macula-io/macula-ci-images' build (OTP 28.4.3, an
      # OpenSSL with ML-DSA, rebar3, Rust 1.98.1, cmake), pinned by digest; the
      # step below refuses anything else. mcl_victron_service_tests guards the pins.
      image: ghcr.io/macula-io/macula-ci-otp:20260923-1347@sha256:b2260d084a3d3c5e0b74932c4ee052a0cadfddddb6587d5d2214873e6bb06330
    steps:
      - uses: actions/checkout@v4
      - name: Verify the toolchain is the one we think it is
        run: |
          openssl version
          rebar3 version
          erl -noshell -eval '
            Otp = string:trim(element(2, file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])))),
            Mldsa = lists:member(mldsa87, crypto:supports(public_keys)),
            io:format("OTP ~s, mldsa87 ~p~n", [Otp, Mldsa]),
            case {Otp, Mldsa} of
                {<<"28.4.3">>, true} -> halt(0);
                _                    -> halt(1)
            end.'
      # No extra packages: since mcl_om 0.27 nothing here builds rocksdb. The
      # store is reckon-db on khepri/ra.
      - run: rebar3 lint
      - run: rebar3 eunit
      - run: rebar3 dialyzer
