# Build the OCI image for mcl-victron and push it to ghcr.io.
#
# TWO CHANNELS, AND ONLY A RELEASE MOVES :latest.
#
#   push of v*   : publishes :<semver>, then :latest once attest signed it
#   push to main : publishes :main and :<sha>       <- the tip, for trying; nothing follows it
#
# No box pins this image: it has no line in macula-fleet's edge/gitops/release-targets, so a
# v* tag changes what the registry publishes and nothing that runs, and a push to main deploys
# nothing. The semver tags stay published, so a bad release is superseded by a later one.

name: build-and-push

on:
  push:
    branches: [main]
    tags: ['v*']
    # A push that changes no code must not build. ⚠ On the push that CREATES a
    # branch, GitHub filters on the head commit alone, so a first push whose
    # last commit is docs-only builds nothing. Dispatch this workflow then.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - 'assets/**'
  workflow_dispatch:

# One build per ref: three quick pushes would otherwise finish in any order and
# leave :main on whichever finished last, not whichever was pushed last.
concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # REFUSED BEFORE ANYTHING IS PUSHED: a v* tag off the default branch (or off its
  # line's release-<major>.<minor> branch), or whose version is not the one this
  # repository publishes, stops here, so a refused tag leaves no image on the
  # registry. Any other ref passes. attest-image checks the same again before it
  # signs. Pinned by full commit sha, as the attest call is.
  guard:
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/release-guard.yml@b4c41abb404c32215a2823b7f19ac65b732e1dfe

  # NO IMAGE WHILE ITS OWN TESTS ARE RED. lint-and-test.yml, called on the commit
  # this run builds, and the build waits on it (mcl-om#34).
  test:
    uses: ./.github/workflows/lint-and-test.yml

  build-and-push:
    needs: [guard, test]
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tag
        id: tag
        run: |
          # A v* tag publishes its version here; :latest moves in promote-latest, only after
          # attest has signed this digest. main publishes :main and :<sha>; no box follows those.
          img=ghcr.io/macula-services/mcl-victron
          case "${GITHUB_REF}" in
            refs/tags/v*)    echo "tags=$img:${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT" ;;
            refs/heads/main) echo "tags=$img:main,$img:${GITHUB_SHA}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::only a v* tag publishes a version and :latest, only main :main and :<sha>; refusing ${GITHUB_REF}"; exit 1 ;;
          esac

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          # The commit the image was built from, readable from the image itself.
          build-args: |
            REVISION=${{ github.sha }}

  # SIGNED BY DIGEST, SBOM AND PROVENANCE ATTESTED, keyless, so a box can refuse any digest that did
  # not come from this workflow on a commit of this repository (macula-fleet's reconciler checks it
  # before it runs the image). Pinned by full commit sha: the signing identity is that file at that
  # ref. See macula-ci-images' README.
  attest:
    needs: build-and-push
    if: needs.build-and-push.outputs.digest != ''
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: macula-io/macula-ci-images/.github/workflows/attest-image.yml@fa59fba58d1b65dce35f8613dcb257273a0f29ed
    with:
      image: ghcr.io/macula-services/mcl-victron
      digest: ${{ needs.build-and-push.outputs.digest }}

  # :latest moves LAST: only on a v* tag, and only once attest has signed and attested this
  # digest. A client that pulls :latest in the window between push and signature would otherwise
  # refuse the release (and remember that for an hour).
  promote-latest:
    needs: [build-and-push, attest]
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-and-push.outputs.digest != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point :latest at the signed digest
        env:
          IMAGE: ghcr.io/macula-services/mcl-victron
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        # --prefer-index=false: a CARBON COPY of the signed manifest. Without it imagetools wraps a
        # single manifest in a new index, a digest attest never signed, and :latest would point at it.
        run: |
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          got="$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')"
          if [ "$got" != "$DIGEST" ]; then
            echo "::error:::latest resolves to $got, not the signed $DIGEST"
            exit 1
          fi
