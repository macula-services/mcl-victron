# Build the OCI image for mcl-victron and push it to ghcr.io.
#
# TWO CHANNELS, AND ONLY A RELEASE MOVES :latest.
#
#   push of v*   : publishes :<semver> and :latest  <- the dev fleet's deploy channel
#   push to main : publishes :main and :<sha>       <- the tip, for trying; nothing follows it
#
# The dev fleet (macula-fleet) runs :latest: each box's reconciler pulls it, verifies the
# digest it resolved to (signature, SBOM, provenance) and runs that digest. So a green v* tag
# IS the deploy, with no commit to the fleet, and a push to main deploys nothing. The semver
# tags stay published, so a bad release can be pinned back to a known one.

name: build-and-push

on:
  push:
    branches: [main]
    tags: ['v*']
    # A push that changes no code must not build. ⚠ On the push that CREATES a
    # branch, GitHub filters on the head commit alone, so a first push whose
    # last commit is docs-only builds nothing. Dispatch this workflow then.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
  workflow_dispatch:

# One build per ref: three quick pushes would otherwise finish in any order and
# leave :latest on whichever finished last.
concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tag
        id: tag
        run: |
          # :latest is the dev fleet's deploy channel: it moves only on a v* tag whose build went
          # green, and a box picks it up on its next reconcile. main publishes :main and :<sha>
          # for trying the tip; no box follows those.
          img=ghcr.io/macula-services/mcl-victron
          case "${GITHUB_REF}" in
            refs/tags/v*)    echo "tags=$img:${GITHUB_REF#refs/tags/v},$img:latest" >> "$GITHUB_OUTPUT" ;;
            refs/heads/main) echo "tags=$img:main,$img:${GITHUB_SHA}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::only a v* tag publishes a version and :latest, only main :main and :<sha>; refusing ${GITHUB_REF}"; exit 1 ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          # The commit the image was built from, readable from the image itself.
          build-args: |
            REVISION=${{ github.sha }}
