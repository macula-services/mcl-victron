<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" role="img" aria-label="mcl-victron system context">
<title>mcl-victron system context</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1100" height="780"/>
<rect class="b-per" x="40" y="30" width="320" height="120" rx="10"/>
<circle class="head" cx="66" cy="54" r="9"/>
<text class="t-name" x="84" y="58">Service operator</text>
<text class="t-type" x="84" y="76">[Person]</text>
<text class="t-desc" x="56" y="100">Runs the box, sets MCL_BOX, the realm</text>
<text class="t-desc" x="56" y="116">and station variables, and points the</text>
<text class="t-desc" x="56" y="132">service at the GX's LAN address</text>
<rect class="b-ext" x="740" y="30" width="320" height="136" rx="10"/>
<text class="t-name" x="756" y="58">Consumers of the readings</text>
<text class="t-type" x="756" y="76">[External system]</text>
<text class="t-desc" x="756" y="100">Subscribe to one fact and filter it by</text>
<text class="t-desc" x="756" y="116">portal, service and D-Bus path: the</text>
<text class="t-desc" x="756" y="132">device and the path are in the payload,</text>
<text class="t-desc" x="756" y="148">not in the topic name.</text>
<rect class="b-sys" x="390" y="220" width="320" height="152" rx="10"/>
<text class="t-name" x="406" y="248">mcl-victron</text>
<text class="t-type" x="406" y="266">[mcl_om mesh service]</text>
<text class="t-desc" x="406" y="290">Watches one GX device's dbus-flashmq</text>
<text class="t-desc" x="406" y="306">broker on the LAN, records every</text>
<text class="t-desc" x="406" y="322">reading in its own reckon-db store,</text>
<text class="t-desc" x="406" y="338">and publishes each one live as</text>
<text class="t-desc" x="406" y="354">reading_recorded_v1.</text>
<rect class="b-ext" x="40" y="470" width="320" height="136" rx="10"/>
<text class="t-name" x="56" y="498">Victron GX device</text>
<text class="t-type" x="56" y="516">[External system]</text>
<text class="t-desc" x="56" y="540">A Cerbo or Venus GX: dbus-flashmq</text>
<text class="t-desc" x="56" y="556">serves MQTT 3.1.1 on port 1883 with</text>
<text class="t-desc" x="56" y="572">no auth and no TLS, publishing under</text>
<text class="t-desc" x="56" y="588">N/+/+/+/#.</text>
<rect class="b-mac" x="390" y="470" width="320" height="120" rx="10"/>
<text class="t-name" x="406" y="498">macula-realm</text>
<text class="t-type" x="406" y="516">[Macula infrastructure]</text>
<text class="t-desc" x="406" y="540">Endorses the node's identity key and</text>
<text class="t-desc" x="406" y="556">admits the boot claim, which must</text>
<text class="t-desc" x="406" y="572">carry MCL_BOX.</text>
<rect class="b-mac" x="740" y="470" width="320" height="136" rx="10"/>
<text class="t-name" x="756" y="498">Macula stations, mesh DHT</text>
<text class="t-type" x="756" y="516">[Macula infrastructure]</text>
<text class="t-desc" x="756" y="540">The pinned seeds in</text>
<text class="t-desc" x="756" y="556">MACULA_STATION_SEEDS carry the fact</text>
<text class="t-desc" x="756" y="572">over QUIC; the DHT holds an</text>
<text class="t-desc" x="756" y="588">advertisement per org procedure.</text>
<path class="edge" d="M200 150V190H470V220" marker-end="url(#a)"/>
<text class="t-rel" x="214" y="172">deploys; sets MCL_BOX</text>
<text class="t-rel" x="208" y="188">and the broker's address</text>
<path class="edge" d="M710 300H900V166" marker-end="url(#a)"/>
<text class="t-rel" x="718" y="292">publishes reading_recorded_v1</text>
<path class="edge" d="M200 470V420H470V372" marker-end="url(#a)"/>
<text class="t-rel" x="214" y="440">publishes N/+/+/+/# over</text>
<text class="t-rel" x="208" y="456">MQTT, and answers keepalives</text>
<path class="edge" d="M550 372V470" marker-end="url(#a)"/>
<text class="t-rel" x="556" y="452">boot claim, MCL_BOX</text>
<path class="edge" d="M630 372V430H900V470" marker-end="url(#a)"/>
<text class="t-rel" x="644" y="422">publishes the one fact</text>
<text class="t-desc" x="40" y="640">The GX speaks first: the service is an MQTT client that subscribes and sends keepalives, and it never writes to the broker.</text>
<text class="t-desc" x="40" y="658">A reading the mesh does not take is dropped and kept in the store, never replayed, because an old reading would arrive looking current.</text>
<rect class="b-sys" x="24" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="728">In scope</text>
<rect class="b-per" x="110.8" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="728">Person</text>
<rect class="b-mac" x="184.39999999999998" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="728">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="728">External system</text>
<rect class="b-cmp" x="490.0" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="728">Container or component</text>
</svg>
